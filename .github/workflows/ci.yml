name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # live end-to-end against real vanilla servers, one job per Minecraft
  # version: downloads the official server jar from piston-meta, boots a
  # superflat + a natural-terrain world, then drives botfleet through the
  # full REST/ws/pilot suite. this is the verification half of staying
  # current — every version the README claims must appear in this matrix.
  live-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
        mc: ['26.3', '26.2', '1.21.8']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25 # minecraft 26.x servers require java 25; runs 1.21.x fine
      - run: npm ci
      - name: boot the superflat server
        run: |
          MC_VERSION=${{ matrix.mc }} MC_DIR=server MC_PORT=25565 \
            nohup ./scripts/e2e-server.sh > server-boot.log 2>&1 &
          for i in $(seq 1 240); do
            grep -q "Done (" server-boot.log 2>/dev/null && break
            sleep 2
          done
          grep -q "Done (" server-boot.log || { echo "server did not boot"; tail -40 server-boot.log; exit 1; }
          grep "Starting minecraft server version" server-boot.log | tail -1
      - name: run the live e2e suite (flat + natural terrain)
        run: |
          BOTFLEET_LIVE_E2E=1 MC_HOST=127.0.0.1 MC_PORT=25565 MC_VERSION=${{ matrix.mc }} APP_PORT=3117 \
            node test/live.js
      - name: server log tail on failure
        if: failure()
        run: tail -60 server-boot.log server/logs/latest.log server-normal/logs/latest.log 2>/dev/null || true

  # the download-and-run path: exactly what a user does with the release
  # bundle — ./run.sh demo must install deps, boot a local vanilla server,
  # seed three units, and Ctrl-C must leave nothing behind
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25 # auto-picks minecraft 26.2 for the demo
      - name: run.sh demo boots the whole stack
        run: |
          setsid nohup ./run.sh demo > demo.log 2>&1 &
          for i in $(seq 1 240); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          N=0
          for i in $(seq 1 120); do
            N=$(curl -fsS http://127.0.0.1:3000/api/bots 2>/dev/null | grep -o '"status":"online"' | wc -l)
            [ "$N" -ge 3 ] && break
            sleep 2
          done
          echo "online units: $N"
          [ "$N" -ge 3 ] || { echo "units did not connect"; tail -40 demo.log; exit 1; }
          grep -m1 'demo server: minecraft' demo.log
      - name: Ctrl-C must reap the whole stack
        run: |
          NPID=$(pgrep -f 'node src/index.js' | head -1)
          PGID=$(ps -o pgid= -p "$NPID" | tr -d ' ')
          kill -INT -"$PGID"
          for i in $(seq 1 30); do
            pgrep -f 'server.jar' >/dev/null 2>&1 || break
            sleep 1
          done
          if pgrep -f 'server.jar' >/dev/null 2>&1; then
            echo "orphaned server.jar after shutdown:"; pgrep -af server.jar; exit 1
          fi
          echo "clean shutdown — no orphans"
      - name: demo log tail on failure
        if: failure()
        run: tail -60 demo.log mcserver/logs/latest.log 2>/dev/null || true

  # currency check — fails (softly) when a new Minecraft release exists
  # without a support path; the version-guard workflow turns this into an
  # issue on its daily schedule instead of blocking pull requests
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/version-check.mjs
        continue-on-error: true
